<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunflowers — 3D Living Botanical Painting</title>
  <style>
    /* ==========================================================================
       1. CORE RESETS & THEME
       ========================================================================== */
    :root {
      --bg-color: #020204;
      --gold-glow: #e29b12;
      --text-muted: #8c8270;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: #eae5d9;
      font-family: var(--font-family);
      user-select: none;
      -webkit-user-select: none;
    }

    /* 3D Viewport Perspective Container */
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 55%, #0e0a04 0%, #040306 65%, #010102 100%);
      perspective: 1200px;
      perspective-origin: 50% 50%;
      overflow: hidden;
    }

    /* 3D Tilting Stage wrapper that moves with mouse/touch & idle breath */
    #stage-3d {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.25, 1);
    }

    svg#sunflower-art {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: auto;
      transform-style: preserve-3d;
      filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85));
    }

    /* Ambient background golden breathing glow */
    .ambient-glow {
      opacity: 0;
      transform-origin: center center;
      animation: glowFadeIn 4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
                 glowBreathe 9s ease-in-out infinite alternate 4s;
    }

    @keyframes glowFadeIn {
      from { opacity: 0; transform: scale(0.65); }
      to   { opacity: 0.75; transform: scale(1.0); }
    }

    @keyframes glowBreathe {
      0%   { opacity: 0.65; transform: scale(0.96); }
      100% { opacity: 0.90; transform: scale(1.08); }
    }

    /* Floating ambient pollen particles drifting in 3D space */
    .drifting-speck {
      opacity: 0;
      animation: floatSpeck var(--dur, 12s) cubic-bezier(0.4, 0, 0.6, 1) infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes floatSpeck {
      0% {
        opacity: 0;
        transform: translateY(0px) translateX(0px) scale(0.6);
      }
      20% {
        opacity: var(--max-alpha, 0.75);
      }
      80% {
        opacity: var(--max-alpha, 0.75);
      }
      100% {
        opacity: 0;
        transform: translateY(-260px) translateX(var(--drift-x, 30px)) scale(1.2);
      }
    }

    /* ==========================================================================
       2. OUTLINE-FIRST THEN COLOR ANIMATION CLASSES
       ========================================================================== */

    /* Phase 1: Pure stroke sketching with pathLength=1 normalization */
    .draw-stroke {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: strokeAnimation var(--dur, 1.2s) cubic-bezier(0.35, 0.7, 0.25, 1) forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes strokeAnimation {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Phase 2: Dual outline-drawing then outline softening */
    .soften-outline {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: strokeAnimation var(--draw-dur, 1.0s) cubic-bezier(0.35, 0.7, 0.25, 1) forwards,
                 fadeOutline 0.8s ease forwards;
      animation-delay: var(--delay, 0s), calc(var(--delay, 0s) + var(--draw-dur, 1.0s) * 0.8);
    }

    @keyframes fadeOutline {
      to {
        stroke-opacity: var(--soft-opacity, 0.35);
        stroke-width: var(--soft-width, 0.75px);
      }
    }

    /* Phase 3: Shape fill fade-in */
    .fade-fill {
      opacity: 0;
      animation: revealFill var(--fade-dur, 0.9s) cubic-bezier(0.25, 1, 0.5, 1) forwards;
      animation-delay: var(--fill-delay, 0s);
    }

    @keyframes revealFill {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Petal growth: unfurling out from base with organic 3D expansion */
    .petal-unfurl {
      opacity: 0;
      transform-origin: var(--origin-x) var(--origin-y);
      animation: unfurlAction var(--dur, 0.95s) cubic-bezier(0.34, 1.25, 0.64, 1) forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes unfurlAction {
      0% {
        opacity: 0;
        transform: scale(0.12) rotate(var(--jitter-rot, 3deg));
      }
      45% {
        opacity: 0.85;
      }
      100% {
        opacity: 1;
        transform: scale(1.0) rotate(0deg);
      }
    }

    /* Head glow: soft warm volumetric expansion behind the petals */
    .head-halo {
      opacity: 0;
      transform-origin: var(--origin-x) var(--origin-y);
      animation: haloExpansion var(--dur, 1.8s) cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes haloExpansion {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      100% {
        opacity: var(--target-opacity, 0.75);
        transform: scale(1.0);
      }
    }

    /* Seeds blooming outward from center on 3D phyllotaxis dome */
    .seed-spiral-bloom {
      opacity: 0;
      transform-origin: var(--origin-x) var(--origin-y);
      animation: seedBloomAnimation var(--dur, 1.4s) cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      animation-delay: var(--delay, 0s);
    }

    @keyframes seedBloomAnimation {
      0% {
        opacity: 0;
        transform: scale(0.12);
      }
      50% {
        opacity: 0.75;
      }
      100% {
        opacity: 1;
        transform: scale(1.0);
      }
    }

    /* Gentle post-bloom breeze sway per flower */
    .flower-group {
      transform-origin: var(--base-x) var(--base-y);
      animation: breezeSway var(--sway-period, 7.5s) ease-in-out infinite alternate;
      animation-delay: var(--sway-delay, 16s);
    }

    @keyframes breezeSway {
      0%   { transform: rotate(calc(-1 * var(--sway-amp, 1.3deg))); }
      100% { transform: rotate(var(--sway-amp, 1.3deg)); }
    }

    /* ==========================================================================
       3. 3D ORBIT & CONTROLS UI
       ========================================================================== */
    .ui-controls {
      position: absolute;
      top: 24px;
      right: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }

    .glass-pill {
      background: rgba(18, 14, 8, 0.72);
      border: 1px solid rgba(226, 155, 18, 0.35);
      border-radius: 999px;
      color: #f7dfa5;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 9px 18px 9px 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 16px rgba(226, 155, 18, 0.15);
    }

    .glass-pill:hover {
      background: rgba(35, 26, 14, 0.88);
      border-color: rgba(245, 188, 55, 0.7);
      color: #fff6d6;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65), 0 0 24px rgba(226, 155, 18, 0.3);
      transform: translateY(-1px);
    }

    .glass-pill:active {
      transform: translateY(1px);
    }

    .glass-pill svg {
      width: 14px;
      height: 14px;
      transition: transform 0.4s ease;
    }

    .glass-pill:hover svg {
      transform: rotate(-180deg);
    }

    .active-badge {
      border-color: rgba(60, 210, 120, 0.6);
      color: #bbf7d0;
    }

    .hint-chip {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(240, 225, 195, 0.65);
      background: rgba(12, 10, 6, 0.65);
      border: 1px solid rgba(226, 155, 18, 0.2);
      border-radius: 999px;
      padding: 6px 16px;
      backdrop-filter: blur(8px);
      pointer-events: none;
      letter-spacing: 0.03em;
      animation: hintFade 6s ease-in-out forwards 4s;
    }

    @keyframes hintFade {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -6px); }
    }

    /* Accessibility: Respect Reduced Motion Preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001s !important;
        animation-delay: 0s !important;
        transition-duration: 0.001s !important;
      }
      .draw-stroke, .soften-outline {
        stroke-dashoffset: 0 !important;
      }
      .fade-fill, .petal-unfurl, .head-halo, .seed-spiral-bloom {
        opacity: 1 !important;
        transform: none !important;
      }
      #stage-3d {
        transform: none !important;
      }
    }

    /* Instant Repaint Mode (preserves finished art on window resize / phone rotation) */
    .rendered-instant *,
    .rendered-instant *::before,
    .rendered-instant *::after {
      animation-duration: 0.001s !important;
      animation-delay: 0s !important;
      transition-duration: 0.001s !important;
    }
    .rendered-instant .draw-stroke,
    .rendered-instant .soften-outline {
      stroke-dashoffset: 0 !important;
    }
    .rendered-instant .fade-fill,
    .rendered-instant .petal-unfurl,
    .rendered-instant .head-halo,
    .rendered-instant .seed-spiral-bloom {
      opacity: 1 !important;
      transform: scale(1.0) !important;
    }
  </style>
</head>
<body>

  <!-- Floating UI Controls -->
  <header class="ui-controls" role="toolbar" aria-label="Artwork controls">
    <button class="glass-pill active-badge" id="btn-3d" aria-label="Toggle Interactive 3D Perspective Tilt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      <span id="label-3d">3D Depth: On</span>
    </button>

    <button class="glass-pill" id="btn-replay" aria-label="Repaint artwork with a new seed (or press R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span>Repaint</span>
    </button>
  </header>

  <!-- Interactive Hint Chip -->
  <div class="hint-chip">✨ Move your mouse or drag to explore true 3D perspective depth</div>

  <!-- SVG Drawing Canvas with 3D Perspective Wrapper -->
  <main id="canvas-container">
    <div id="stage-3d">
      <svg id="sunflower-art" role="img" aria-label="A painterly botanical bouquet of sunflowers blooming in sculptural 3D on a dark canvas">
        <defs id="svg-defs">
          <!-- Master 3D Gradients & Volumetric Drop Shadow Filters -->
        </defs>
        <!-- Layered Scene Graph -->
        <g id="layer-ambient-glow"></g>
        <g id="layer-back-shadows"></g>
        <g id="layer-stems"></g>
        <g id="layer-leaves"></g>
        <g id="layer-flowers"></g>
        <g id="layer-pollen"></g>
        <g id="layer-vignette-grain" pointer-events="none"></g>
      </svg>
    </div>
  </main>

  <script>
    /**
     * =========================================================================
     * SUNFLOWERS — 3D SCULPTURAL LIVING PAINTING
     * =========================================================================
     * Features:
     * 1. 3D Dual-Facet Petals: Light-facing facet (sunlight gold) vs Shadow facet (rich bronze).
     * 2. 3D Convex Protruding Seed Dome with normal vector directional lighting.
     * 3. Interlocking Ring Shadows: Dome casts cast-shadow down onto petals.
     * 4. Multi-Layer Z-Depth with interactive mouse/gyroscope perspective parallax.
     * 5. Outline-first sketch reveal, phyllotaxis seed spirals, and post-bloom breeze sway.
     */

    // --- 1. SEEDED PSEUDO-RANDOM GENERATOR (Mulberry32) ---
    function createPRNG(seed) {
      let s = seed >>> 0;
      return function() {
        let t = (s += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    let currentSeed = 42;
    let rng = createPRNG(currentSeed);

    function rand(min, max) {
      return min + rng() * (max - min);
    }
    function randInt(min, max) {
      return Math.floor(rand(min, max + 1));
    }

    // --- 2. VECTOR & GEOMETRIC MATH HELPERS ---
    function evalCubicBezier(p0, p1, p2, p3, t) {
      const mt = 1 - t;
      const mt2 = mt * mt;
      const t2 = t * t;
      return {
        x: mt2 * mt * p0.x + 3 * mt2 * t * p1.x + 3 * mt * t2 * p2.x + t2 * t * p3.x,
        y: mt2 * mt * p0.y + 3 * mt2 * t * p1.y + 3 * mt * t2 * p2.y + t2 * t * p3.y
      };
    }

    function evalCubicBezierTangent(p0, p1, p2, p3, t) {
      const mt = 1 - t;
      const t2 = t * t;
      const dx = 3 * mt * mt * (p1.x - p0.x) + 6 * mt * t * (p2.x - p1.x) + 3 * t2 * (p3.x - p2.x);
      const dy = 3 * mt * mt * (p1.y - p0.y) + 6 * mt * t * (p2.y - p1.y) + 3 * t2 * (p3.y - p2.y);
      const len = Math.hypot(dx, dy) || 1;
      return { x: dx / len, y: dy / len, angle: Math.atan2(dy, dx) };
    }

    const SVG_NS = "http://www.w3.org/2000/svg";
    function createSVGEl(tag, attrs = {}) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) {
        el.setAttribute(k, v);
      }
      return el;
    }

    // --- 3. REUSABLE MASTER 3D GRADIENTS & ATMOSPHERE DEFS ---
    function setupMasterDefs(defsEl) {
      defsEl.innerHTML = `
        <!-- Volumetric Background Warmth -->
        <radialGradient id="grad-bg-glow" cx="50%" cy="52%" r="50%">
          <stop offset="0%" stop-color="#4e2b05" stop-opacity="0.88"/>
          <stop offset="35%" stop-color="#2a1603" stop-opacity="0.6"/>
          <stop offset="70%" stop-color="#110902" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#020204" stop-opacity="0"/>
        </radialGradient>

        <!-- Behind-Head Backlight Halo -->
        <radialGradient id="grad-head-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f8ba24" stop-opacity="0.85"/>
          <stop offset="42%" stop-color="#d9780e" stop-opacity="0.45"/>
          <stop offset="78%" stop-color="#803803" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#020204" stop-opacity="0"/>
        </radialGradient>

        <!-- Cylindrical Stem 3D Lighting (Dark Left Rim, Bright Sunlit Highlight, Core Shadow, Soft Bounce) -->
        <linearGradient id="grad-stem-3d" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#16260c"/>
          <stop offset="22%" stop-color="#3c591c"/>
          <stop offset="48%" stop-color="#7ea73c"/> <!-- Sunlit specular edge -->
          <stop offset="78%" stop-color="#3c591c"/>
          <stop offset="100%" stop-color="#121e0a"/>
        </linearGradient>

        <!-- Leaf 3D Blade (Sunward Olive Green to Deep Forest Shadow) -->
        <linearGradient id="grad-leaf-3d" x1="0%" y1="100%" x2="40%" y2="0%">
          <stop offset="0%" stop-color="#13230a"/>
          <stop offset="35%" stop-color="#2c4715"/>
          <stop offset="68%" stop-color="#557c23"/>
          <stop offset="100%" stop-color="#84a638"/>
        </linearGradient>

        <!-- Petal 3D Facet: Sunward Bright Facet (Sunlight Golden Yellow) -->
        <linearGradient id="grad-petal-sun" x1="0%" y1="100%" x2="15%" y2="0%">
          <stop offset="0%" stop-color="#ba5f06"/>
          <stop offset="20%" stop-color="#e3810c"/>
          <stop offset="55%" stop-color="#f7b714"/>
          <stop offset="85%" stop-color="#fedd4a"/>
          <stop offset="100%" stop-color="#fff696"/>
        </linearGradient>

        <!-- Petal 3D Facet: Shadowed Facet (Deep Amber Bronze) -->
        <linearGradient id="grad-petal-shadow" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#6f2802"/>
          <stop offset="25%" stop-color="#9a4306"/>
          <stop offset="65%" stop-color="#c96d0c"/>
          <stop offset="90%" stop-color="#ea9d1b"/>
          <stop offset="100%" stop-color="#fed352"/>
        </linearGradient>

        <!-- Back Whorl Petals (Receding Depth Bronze) -->
        <linearGradient id="grad-petal-back" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#4f1b01"/>
          <stop offset="30%" stop-color="#843905"/>
          <stop offset="70%" stop-color="#b65e0a"/>
          <stop offset="100%" stop-color="#dc8714"/>
        </linearGradient>

        <!-- Calyx Bract Lobes -->
        <linearGradient id="grad-bract" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#122008"/>
          <stop offset="60%" stop-color="#2f4814"/>
          <stop offset="100%" stop-color="#547522"/>
        </linearGradient>

        <!-- 3D Convex Seed Dome (Spherical Lighting with offset highlight) -->
        <radialGradient id="grad-seed-dome-3d" cx="38%" cy="32%" r="65%">
          <stop offset="0%" stop-color="#6b3a19"/> <!-- Specular light on dome crown -->
          <stop offset="25%" stop-color="#46220d"/>
          <stop offset="55%" stop-color="#251105"/>
          <stop offset="85%" stop-color="#130802"/>
          <stop offset="100%" stop-color="#070200"/>
        </radialGradient>

        <!-- Cast Drop Shadow under Dome onto Petals -->
        <radialGradient id="grad-dome-cast-shadow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.82"/>
          <stop offset="65%" stop-color="#000000" stop-opacity="0.5"/>
          <stop offset="90%" stop-color="#000000" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <!-- Calyx Under-Head Drop Shadow onto Stem -->
        <radialGradient id="grad-calyx-shadow" cx="50%" cy="40%" r="50%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.75"/>
          <stop offset="60%" stop-color="#000000" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <!-- Stem Bottom Fade Mask -->
        <linearGradient id="grad-stem-mask" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="84%" stop-color="#ffffff"/>
          <stop offset="96%" stop-color="#555555"/>
          <stop offset="100%" stop-color="#000000"/>
        </linearGradient>
        <mask id="stem-fade-mask">
          <rect x="-3000" y="-3000" width="8000" height="8000" fill="url(#grad-stem-mask)"/>
        </mask>

        <!-- Soft Volumetric Blur Filter -->
        <filter id="soft-glow-blur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="32"/>
        </filter>

        <!-- Fine 3D Drop Shadow for Petals & Foreground Flowers -->
        <filter id="petal-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
        </filter>

        <!-- Fine Canvas Grain Overlay -->
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
          <feColorMatrix type="matrix" values="
            0 0 0 0 0.95
            0 0 0 0 0.92
            0 0 0 0 0.85
            0 0 0 0 0.07 0" result="coloredNoise"/>
          <feBlend mode="overlay" in="SourceGraphic" in2="coloredNoise"/>
        </filter>
      `;
    }

    // --- 4. PROCEDURAL 3D BOTANICAL GEOMETRY BUILDERS ---

    /**
     * Builds a 3D cylindrical tapered stem with highlight and shadow margins.
     */
    function buildStemGeometry(p0, p1, p2, p3, baseWidth, tipWidth, samples = 48) {
      const leftPts = [];
      const rightPts = [];
      const highlightPts = [];
      const hairs = [];

      for (let i = 0; i <= samples; i++) {
        const t = i / samples;
        const pt = evalCubicBezier(p0, p1, p2, p3, t);
        const tan = evalCubicBezierTangent(p0, p1, p2, p3, t);

        const nx = -tan.y;
        const ny = tan.x;

        // Tapering width
        const wBase = baseWidth * (1 - t * 0.42) + tipWidth * (t * 0.42);
        const wobble = Math.sin(t * 20 + rand(0, 1)) * 0.5 + rand(-0.35, 0.35);
        const halfW = (wBase + wobble) * 0.5;

        const lp = { x: pt.x - nx * halfW, y: pt.y - ny * halfW };
        const rp = { x: pt.x + nx * halfW, y: pt.y + ny * halfW };

        leftPts.push(lp);
        rightPts.push(rp);

        // 3D Specular ridge runs at -25% offset toward sunward side
        highlightPts.push({ x: pt.x - nx * (halfW * 0.35), y: pt.y - ny * (halfW * 0.35) });

        // Fine epidermal hairs
        if (i > 3 && i < samples - 2 && i % 3 === 0) {
          const hairLen = rand(2.8, 5.0);
          hairs.push({
            x1: lp.x, y1: lp.y,
            x2: lp.x - nx * hairLen + tan.x * rand(-1, 1),
            y2: lp.y - ny * hairLen + tan.y * rand(-1, 1)
          });
          hairs.push({
            x1: rp.x, y1: rp.y,
            x2: rp.x + nx * hairLen + tan.x * rand(-1, 1),
            y2: rp.y + ny * hairLen + tan.y * rand(-1, 1)
          });
        }
      }

      let leftLineD = `M ${leftPts[0].x.toFixed(2)} ${leftPts[0].y.toFixed(2)}`;
      for (let i = 1; i < leftPts.length; i++) leftLineD += ` L ${leftPts[i].x.toFixed(2)} ${leftPts[i].y.toFixed(2)}`;

      let rightLineD = `M ${rightPts[0].x.toFixed(2)} ${rightPts[0].y.toFixed(2)}`;
      for (let i = 1; i < rightPts.length; i++) rightLineD += ` L ${rightPts[i].x.toFixed(2)} ${rightPts[i].y.toFixed(2)}`;

      let highlightD = `M ${highlightPts[0].x.toFixed(2)} ${highlightPts[0].y.toFixed(2)}`;
      for (let i = 1; i < highlightPts.length; i++) highlightD += ` L ${highlightPts[i].x.toFixed(2)} ${highlightPts[i].y.toFixed(2)}`;

      let fillD = leftLineD;
      for (let i = rightPts.length - 1; i >= 0; i--) fillD += ` L ${rightPts[i].x.toFixed(2)} ${rightPts[i].y.toFixed(2)}`;
      fillD += " Z";

      return { leftLineD, rightLineD, highlightD, fillD, hairs };
    }

    /**
     * Builds curved 3D drooping heart leaves with cupped lateral depth.
     */
    function buildLeafGeometry(stemPoint, stemTangent, side, length, width) {
      const stalkAngle = stemTangent.angle + (side > 0 ? 0.72 : -0.72) + rand(-0.06, 0.06);
      const stalkLen = length * 0.38;
      const stalkEnd = {
        x: stemPoint.x + Math.cos(stalkAngle) * stalkLen,
        y: stemPoint.y + Math.sin(stalkAngle) * stalkLen + 6
      };

      const stalkD = `M ${stemPoint.x.toFixed(2)} ${stemPoint.y.toFixed(2)} Q ${(stemPoint.x + stalkEnd.x)/2} ${(stemPoint.y + stalkEnd.y)/2 + 4} ${stalkEnd.x.toFixed(2)} ${stalkEnd.y.toFixed(2)}`;

      const bladeAngle = stalkAngle + (side > 0 ? 0.28 : -0.28);
      const tipPt = {
        x: stalkEnd.x + Math.cos(bladeAngle) * length * 1.15,
        y: stalkEnd.y + Math.sin(bladeAngle) * length * 1.15 + length * 0.32
      };

      const midCtrl = {
        x: (stalkEnd.x + tipPt.x) * 0.5 + (side > 0 ? 8 : -8),
        y: (stalkEnd.y + tipPt.y) * 0.5 + 14
      };
      const midribD = `M ${stalkEnd.x.toFixed(2)} ${stalkEnd.y.toFixed(2)} Q ${midCtrl.x.toFixed(2)} ${midCtrl.y.toFixed(2)} ${tipPt.x.toFixed(2)} ${tipPt.y.toFixed(2)}`;

      const midPts = [];
      const steps = 24;
      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const mu = 1 - u;
        midPts.push({
          x: mu * mu * stalkEnd.x + 2 * mu * u * midCtrl.x + u * u * tipPt.x,
          y: mu * mu * stalkEnd.y + 2 * mu * u * midCtrl.y + u * u * tipPt.y
        });
      }

      const leftEdge = [];
      const rightEdge = [];

      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const pt = midPts[i];
        const next = midPts[Math.min(i + 1, steps)];
        const dx = next.x - pt.x;
        const dy = next.y - pt.y;
        const dist = Math.hypot(dx, dy) || 1;
        const nx = -dy / dist;
        const ny = dx / dist;

        let span = Math.sin(Math.pow(u, 0.65) * Math.PI) * width;
        if (u < 0.2) span *= (u / 0.2) * 1.08;

        const serrationL = (i > 1 && i < steps - 1) ? Math.sin(i * 3.8) * 2.2 + rand(-0.4, 0.4) : 0;
        const serrationR = (i > 1 && i < steps - 1) ? Math.cos(i * 3.8) * 2.2 + rand(-0.4, 0.4) : 0;

        leftEdge.push({ x: pt.x - nx * (span + serrationL), y: pt.y - ny * (span + serrationL) });
        rightEdge.push({ x: pt.x + nx * (span + serrationR), y: pt.y + ny * (span + serrationR) });
      }

      let outlineD = `M ${leftEdge[0].x.toFixed(2)} ${leftEdge[0].y.toFixed(2)}`;
      for (let i = 1; i <= steps; i++) outlineD += ` L ${leftEdge[i].x.toFixed(2)} ${leftEdge[i].y.toFixed(2)}`;
      outlineD += ` L ${tipPt.x.toFixed(2)} ${tipPt.y.toFixed(2)}`;
      for (let i = steps; i >= 0; i--) outlineD += ` L ${rightEdge[i].x.toFixed(2)} ${rightEdge[i].y.toFixed(2)}`;
      outlineD += " Z";

      const veins = [];
      const veinFracs = [0.20, 0.36, 0.52, 0.68, 0.82];
      veinFracs.forEach((vf) => {
        const idx = Math.round(vf * steps);
        const origin = midPts[idx];
        const lTarget = leftEdge[idx];
        const rTarget = rightEdge[idx];

        const vlCtrl = { x: (origin.x + lTarget.x) * 0.5, y: (origin.y + lTarget.y) * 0.5 - 4 };
        const vrCtrl = { x: (origin.x + rTarget.x) * 0.5, y: (origin.y + rTarget.y) * 0.5 - 4 };

        veins.push(`M ${origin.x.toFixed(2)} ${origin.y.toFixed(2)} Q ${vlCtrl.x.toFixed(2)} ${vlCtrl.y.toFixed(2)} ${lTarget.x.toFixed(2)} ${lTarget.y.toFixed(2)}`);
        veins.push(`M ${origin.x.toFixed(2)} ${origin.y.toFixed(2)} Q ${vrCtrl.x.toFixed(2)} ${vrCtrl.y.toFixed(2)} ${rTarget.x.toFixed(2)} ${rTarget.y.toFixed(2)}`);
      });

      return { stalkD, outlineD, midribD, veins };
    }

    /**
     * Builds calyx receptacle green phyllary bracts pointing outward behind petals.
     */
    function buildBracts(cx, cy, radius, count = 18) {
      const bractPaths = [];
      for (let i = 0; i < count; i++) {
        const baseAngle = (i / count) * Math.PI * 2 + rand(-0.06, 0.06);
        const bLen = radius * rand(0.58, 0.78);
        const bWid = (Math.PI * 2 * radius / count) * 0.78;

        const cosA = Math.cos(baseAngle);
        const sinA = Math.sin(baseAngle);
        const perpX = -sinA;
        const perpY = cosA;

        const baseL = { x: cx + cosA * (radius * 0.72) - perpX * (bWid * 0.5), y: cy + sinA * (radius * 0.72) - perpY * (bWid * 0.5) };
        const baseR = { x: cx + cosA * (radius * 0.72) + perpX * (bWid * 0.5), y: cy + sinA * (radius * 0.72) + perpY * (bWid * 0.5) };
        const tip = { x: cx + Math.cos(baseAngle) * (radius * 0.72 + bLen), y: cy + Math.sin(baseAngle) * (radius * 0.72 + bLen) };

        const d = `M ${baseL.x.toFixed(2)} ${baseL.y.toFixed(2)} Q ${baseL.x + cosA * (bLen * 0.5)} ${baseL.y + sinA * (bLen * 0.5)} ${tip.x.toFixed(2)} ${tip.y.toFixed(2)} Q ${baseR.x + cosA * (bLen * 0.5)} ${baseR.y + sinA * (bLen * 0.5)} ${baseR.x.toFixed(2)} ${baseR.y.toFixed(2)} Z`;
        bractPaths.push(d);
      }
      return bractPaths;
    }

    /**
     * Builds a true 3D SCULPTURED PETAL with DUAL-FACET LIGHTING:
     * - Divides the petal down its central rib into a Sunward Facet and a Shadowed Facet.
     * - Computes 3D longitudinal curl (tips arching toward or away from camera).
     */
    function build3DPetal(cx, cy, angle, headRadius, length, width, tiltAngle, squashY, isFront) {
      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);
      const nx = -sinA;
      const ny = cosA;

      const rInner = headRadius * 0.88;
      const baseCenter = { x: cx + cosA * rInner, y: cy + sinA * rInner };

      // 3D Curl: Petals on lower front arch down/forward; petals at top arch backward
      const forwardCurl = Math.sin(angle) * 8 + rand(-3, 3);
      const lateralBend = rand(-4.5, 4.5);

      const pLen = length * rand(0.94, 1.06);
      const tip = {
        x: cx + Math.cos(angle) * (rInner + pLen) + nx * lateralBend,
        y: cy + Math.sin(angle) * (rInner + pLen) + ny * lateralBend + forwardCurl
      };

      const bellyDist = rInner + pLen * 0.44;
      const pWid = width * rand(0.92, 1.10);
      const bellyL = {
        x: cx + cosA * bellyDist - nx * (pWid * 0.5),
        y: cy + sinA * bellyDist - ny * (pWid * 0.5)
      };
      const bellyR = {
        x: cx + cosA * bellyDist + nx * (pWid * 0.5),
        y: cy + sinA * bellyDist + ny * (pWid * 0.5)
      };

      const baseL = { x: baseCenter.x - nx * (width * 0.22), y: baseCenter.y - ny * (width * 0.22) };
      const baseR = { x: baseCenter.x + nx * (width * 0.22), y: baseCenter.y + ny * (width * 0.22) };

      // Full outer boundary contour
      const outlineD = `M ${baseL.x.toFixed(2)} ${baseL.y.toFixed(2)} ` +
        `Q ${bellyL.x - cosA * 5} ${bellyL.y - sinA * 5} ${bellyL.x.toFixed(2)} ${bellyL.y.toFixed(2)} ` +
        `Q ${bellyL.x + cosA * (pLen * 0.35)} ${bellyL.y + sinA * (pLen * 0.35)} ${tip.x.toFixed(2)} ${tip.y.toFixed(2)} ` +
        `Q ${bellyR.x + cosA * (pLen * 0.35)} ${bellyR.y + sinA * (pLen * 0.35)} ${bellyR.x.toFixed(2)} ${bellyR.y.toFixed(2)} ` +
        `Q ${bellyR.x - cosA * 5} ${bellyR.y - sinA * 5} ${baseR.x.toFixed(2)} ${baseR.y.toFixed(2)} Z`;

      // Central structural crease
      const creaseD = `M ${baseCenter.x.toFixed(2)} ${baseCenter.y.toFixed(2)} Q ${(baseCenter.x + tip.x)*0.5 + nx * (lateralBend * 0.2)} ${(baseCenter.y + tip.y)*0.5 + ny * (lateralBend * 0.2)} ${tip.x.toFixed(2)} ${tip.y.toFixed(2)}`;

      // 3D FACETS: Left half facet and Right half facet
      const leftFacetD = `M ${baseL.x.toFixed(2)} ${baseL.y.toFixed(2)} ` +
        `Q ${bellyL.x - cosA * 5} ${bellyL.y - sinA * 5} ${bellyL.x.toFixed(2)} ${bellyL.y.toFixed(2)} ` +
        `Q ${bellyL.x + cosA * (pLen * 0.35)} ${bellyL.y + sinA * (pLen * 0.35)} ${tip.x.toFixed(2)} ${tip.y.toFixed(2)} ` +
        `L ${baseCenter.x.toFixed(2)} ${baseCenter.y.toFixed(2)} Z`;

      const rightFacetD = `M ${baseCenter.x.toFixed(2)} ${baseCenter.y.toFixed(2)} ` +
        `L ${tip.x.toFixed(2)} ${tip.y.toFixed(2)} ` +
        `Q ${bellyR.x + cosA * (pLen * 0.35)} ${bellyR.y + sinA * (pLen * 0.35)} ${bellyR.x.toFixed(2)} ${bellyR.y.toFixed(2)} ` +
        `Q ${bellyR.x - cosA * 5} ${bellyR.y - sinA * 5} ${baseR.x.toFixed(2)} ${baseR.y.toFixed(2)} Z`;

      // 3D Directional Lighting on the two facets:
      // Light source vector points from top-left: L = (-0.4, -0.6, 0.7)
      // If petal normal has positive dot product with L, facet A is sunward.
      const sunFacing = (cosA * (-0.4) + sinA * (-0.6)) > 0;

      return {
        outlineD,
        leftFacetD,
        rightFacetD,
        creaseD,
        baseCenter,
        sunFacing
      };
    }

    /**
     * Builds a CONVEX 3D HEMISPHERICAL SEED DOME with true 3D spherical normal vector shading,
     * perspective-compressed phyllotaxis seeds, and upright 3D rim florets.
     */
    function build3DSeedDome(cx, cy, radius, tiltAngle, squashY, seedCount = 360) {
      // 1. Base Ellipse & Wobbly Rim
      const discPts = [];
      const numDiscPts = 36;
      for (let i = 0; i < numDiscPts; i++) {
        const theta = (i / numDiscPts) * Math.PI * 2;
        const rWobble = radius * (1 + Math.sin(theta * 6) * 0.025 + rand(-0.015, 0.015));

        const localX = Math.cos(theta) * rWobble;
        const localY = Math.sin(theta) * rWobble * squashY;

        const rotX = localX * Math.cos(tiltAngle) - localY * Math.sin(tiltAngle);
        const rotY = localX * Math.sin(tiltAngle) + localY * Math.cos(tiltAngle);

        discPts.push({ x: cx + rotX, y: cy + rotY });
      }

      let discD = `M ${discPts[0].x.toFixed(2)} ${discPts[0].y.toFixed(2)}`;
      for (let i = 1; i < numDiscPts; i++) discD += ` L ${discPts[i].x.toFixed(2)} ${discPts[i].y.toFixed(2)}`;
      discD += " Z";

      // 2. Phyllotaxis Spiral Seeds with Spherical 3D Normal Mapping
      const goldenAngle = Math.PI * (3 - Math.sqrt(5)); // ~137.5077°
      let pathCore = "";
      let pathMid = "";
      let pathRim = "";
      let pathHighlights = "";

      for (let n = 1; n <= seedCount; n++) {
        const frac = n / seedCount;
        // Spherical dome projection: rNormalized from center to rim
        const rNorm = Math.sqrt(frac);
        const r = rNorm * (radius * 0.94);
        const theta = n * goldenAngle;

        // 3D Dome Height (Z): protruding forward toward viewer
        const zDome = Math.sqrt(Math.max(0, 1 - rNorm * rNorm)) * (radius * 0.35);

        const localX = Math.cos(theta) * r;
        const localY = Math.sin(theta) * r * squashY - zDome * 0.22; // foreshortening tilt

        const rotX = localX * Math.cos(tiltAngle) - localY * Math.sin(tiltAngle);
        const rotY = localX * Math.sin(tiltAngle) + localY * Math.cos(tiltAngle);

        const pt = { x: cx + rotX, y: cy + rotY };

        // 3D Perspective dot size: seeds protruding near center are closer, larger
        const dotR = (0.8 + (1 - rNorm * 0.35) * 1.6) * rand(0.9, 1.12);

        const circleD = `M ${(pt.x - dotR).toFixed(2)} ${pt.y.toFixed(2)} a ${dotR.toFixed(2)} ${dotR.toFixed(2)} 0 1 0 ${(dotR * 2).toFixed(2)} 0 a ${dotR.toFixed(2)} ${dotR.toFixed(2)} 0 1 0 ${(-dotR * 2).toFixed(2)} 0 `;

        if (frac < 0.25) {
          pathCore += circleD;
        } else if (frac < 0.65) {
          pathMid += circleD;
        } else {
          pathRim += circleD;
        }

        // Specular highlight specks near the top-left crown of the dome
        const isSunlitDomeSector = (Math.cos(theta) * (-0.4) + Math.sin(theta) * (-0.6)) > 0;
        if (frac > 0.35 && frac < 0.85 && isSunlitDomeSector && rng() < 0.22) {
          const hlR = dotR * 0.58;
          const hPt = { x: pt.x - 0.4, y: pt.y - dotR * 0.4 };
          pathHighlights += `M ${(hPt.x - hlR).toFixed(2)} ${hPt.y.toFixed(2)} a ${hlR.toFixed(2)} ${hlR.toFixed(2)} 0 1 0 ${(hlR * 2).toFixed(2)} 0 a ${hlR.toFixed(2)} ${hlR.toFixed(2)} 0 1 0 ${(-hlR * 2).toFixed(2)} 0 `;
        }
      }

      // 3. Upright 3D Disc Florets (Yellow-gold mini tubular crowns along the rim)
      let floretsD = "";
      const numFlorets = 48;
      for (let i = 0; i < numFlorets; i++) {
        const fTheta = (i / numFlorets) * Math.PI * 2 + rand(-0.04, 0.04);
        const fR = radius * rand(0.92, 1.02);

        const flX = Math.cos(fTheta) * fR;
        const flY = Math.sin(fTheta) * fR * squashY;

        const fRotX = flX * Math.cos(tiltAngle) - flY * Math.sin(tiltAngle);
        const fRotY = flX * Math.sin(tiltAngle) + flY * Math.cos(tiltAngle);

        const fLen = rand(4, 7);
        const tipX = fRotX + Math.cos(fTheta) * fLen;
        const tipY = fRotY + Math.sin(fTheta) * fLen;

        floretsD += `M ${(cx + fRotX).toFixed(2)} ${(cy + fRotY).toFixed(2)} L ${(cx + tipX).toFixed(2)} ${(cy + tipY).toFixed(2)} `;
      }

      return { discD, pathCore, pathMid, pathRim, pathHighlights, floretsD };
    }

    // --- 6. 3D ARTWORK ASSEMBLY ENGINE ---
    function renderArtwork(seed, { instant = false } = {}) {
      rng = createPRNG(seed);

      const svg = document.getElementById("sunflower-art");
      if (svg && svg.classList) {
        if (instant) {
          svg.classList.add("rendered-instant");
        } else {
          svg.classList.remove("rendered-instant");
        }
      }

      const defs = document.getElementById("svg-defs");
      const layerAmbient = document.getElementById("layer-ambient-glow");
      const layerBackShadows = document.getElementById("layer-back-shadows");
      const layerStems = document.getElementById("layer-stems");
      const layerLeaves = document.getElementById("layer-leaves");
      const layerFlowers = document.getElementById("layer-flowers");
      const layerPollen = document.getElementById("layer-pollen");
      const layerVignette = document.getElementById("layer-vignette-grain");

      // Reset
      setupMasterDefs(defs);
      layerAmbient.innerHTML = "";
      layerBackShadows.innerHTML = "";
      layerStems.innerHTML = "";
      layerLeaves.innerHTML = "";
      layerFlowers.innerHTML = "";
      layerPollen.innerHTML = "";
      layerVignette.innerHTML = "";

      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const aspect = vw / vh;

      let baseW = 1000;
      let baseH = Math.round(baseW / aspect);
      if (aspect < 0.75) {
        baseH = 1350;
        baseW = Math.round(baseH * aspect);
      } else if (aspect > 1.8) {
        baseW = 1300;
        baseH = Math.round(baseW / aspect);
      }

      svg.setAttribute("viewBox", `0 0 ${baseW} ${baseH}`);

      // 1. Ambient Background Glow (Z = -100px)
      const glowCx = baseW * 0.50;
      const glowCy = baseH * 0.52;
      const glowR = Math.max(baseW, baseH) * 0.48;

      const bgGlow = createSVGEl("circle", {
        cx: glowCx, cy: glowCy, r: glowR,
        fill: "url(#grad-bg-glow)",
        class: "ambient-glow"
      });
      layerAmbient.appendChild(bgGlow);

      // 2. Build Sunflowers with 3D Depth
      SCENE_CONFIG.forEach((cfg) => {
        if (vw < cfg.minWidth) return;

        const flowerGroup = createSVGEl("g", {
          id: cfg.id,
          class: "flower-group"
        });

        // Apply 3D volumetric drop shadow to foreground flowers
        if (cfg.depthZ > 20) {
          flowerGroup.setAttribute("filter", "url(#petal-shadow)");
        }

        const flowerBaseX = cfg.stemBaseX * baseW;
        const flowerBaseY = cfg.stemBaseY * baseH;
        flowerGroup.style.setProperty("--base-x", `${flowerBaseX}px`);
        flowerGroup.style.setProperty("--base-y", `${flowerBaseY}px`);
        flowerGroup.style.setProperty("--sway-period", `${cfg.swayPeriod}s`);
        flowerGroup.style.setProperty("--sway-amp", `${cfg.swayAmp}deg`);
        flowerGroup.style.setProperty("--sway-delay", `${cfg.startDelay + 6.0}s`);

        // Head position
        const headCx = cfg.xRel * baseW + rand(-8, 8);
        const headCy = cfg.yRel * baseH + rand(-10, 10);

        // Stem Bezier Control Points
        const p0 = { x: flowerBaseX, y: flowerBaseY };
        const p3 = { x: headCx, y: headCy };
        const p1 = {
          x: flowerBaseX + (headCx - flowerBaseX) * 0.35 + cfg.leanX * 0.4,
          y: flowerBaseY - (flowerBaseY - headCy) * 0.45
        };
        const p2 = {
          x: headCx - cfg.leanX * 0.6,
          y: headCy + (flowerBaseY - headCy) * 0.28
        };

        const stemTopTan = evalCubicBezierTangent(p0, p1, p2, p3, 1.0);
        const headTilt = stemTopTan.angle - Math.PI / 2 + rand(-0.12, 0.12);
        const squashY = rand(0.82, 0.88); // 3D perspective foreshortening

        const tStart = cfg.startDelay;

        // --- A. Behind-Head Volumetric Halo Glow ---
        const haloEl = createSVGEl("circle", {
          cx: headCx, cy: headCy, r: cfg.headRadius * 2.3,
          fill: "url(#grad-head-glow)",
          class: "head-halo",
          filter: "url(#soft-glow-blur)"
        });
        haloEl.style.setProperty("--origin-x", `${headCx}px`);
        haloEl.style.setProperty("--origin-y", `${headCy}px`);
        haloEl.style.setProperty("--delay", `${tStart + 2.8}s`);
        haloEl.style.setProperty("--dur", "1.8s");
        haloEl.style.setProperty("--target-opacity", "0.75");
        flowerGroup.appendChild(haloEl);

        // --- B. 3D Cylindrical Stem ---
        const stemGeom = buildStemGeometry(p0, p1, p2, p3, cfg.stemWidthBase, cfg.stemWidthTip);

        // 3D Stem Under-Drop Shadow
        const stemShadow = createSVGEl("path", {
          d: stemGeom.fillD,
          fill: "#000000",
          opacity: "0.45",
          transform: "translate(4, 7)",
          mask: "url(#stem-fade-mask)",
          class: "fade-fill"
        });
        stemShadow.style.setProperty("--fill-delay", `${tStart + 1.0}s`);
        stemShadow.style.setProperty("--fade-dur", "0.8s");
        layerBackShadows.appendChild(stemShadow);

        // Stem 3D Lit Body
        const stemFill = createSVGEl("path", {
          d: stemGeom.fillD,
          fill: "url(#grad-stem-3d)",
          mask: "url(#stem-fade-mask)",
          class: "fade-fill"
        });
        stemFill.style.setProperty("--fill-delay", `${tStart + 1.1}s`);
        stemFill.style.setProperty("--fade-dur", "0.7s");
        flowerGroup.appendChild(stemFill);

        // Stem 3D Specular Highlight Ridge
        const stemHL = createSVGEl("path", {
          d: stemGeom.highlightD,
          fill: "none",
          stroke: "#9bc64e",
          "stroke-width": "1.4",
          "stroke-linecap": "round",
          opacity: "0.65",
          mask: "url(#stem-fade-mask)",
          class: "draw-stroke"
        });
        stemHL.style.setProperty("--delay", `${tStart + 0.3}s`);
        stemHL.style.setProperty("--dur", "1.2s");
        flowerGroup.appendChild(stemHL);

        // Stem Outlines
        const stemOutlineL = createSVGEl("path", {
          d: stemGeom.leftLineD,
          fill: "none",
          stroke: "#223512",
          "stroke-width": "1.2",
          "stroke-linecap": "round",
          pathLength: "1",
          mask: "url(#stem-fade-mask)",
          class: "soften-outline"
        });
        stemOutlineL.style.setProperty("--delay", `${tStart}s`);
        stemOutlineL.style.setProperty("--draw-dur", "1.3s");
        stemOutlineL.style.setProperty("--soft-opacity", "0.35");
        flowerGroup.appendChild(stemOutlineL);

        const stemOutlineR = createSVGEl("path", {
          d: stemGeom.rightLineD,
          fill: "none",
          stroke: "#14220b",
          "stroke-width": "1.3",
          "stroke-linecap": "round",
          pathLength: "1",
          mask: "url(#stem-fade-mask)",
          class: "soften-outline"
        });
        stemOutlineR.style.setProperty("--delay", `${tStart}s`);
        stemOutlineR.style.setProperty("--draw-dur", "1.3s");
        stemOutlineR.style.setProperty("--soft-opacity", "0.4");
        flowerGroup.appendChild(stemOutlineR);

        // Tiny Stem Epidermal Hairs
        stemGeom.hairs.forEach(h => {
          const hairLine = createSVGEl("line", {
            x1: h.x1, y1: h.y1, x2: h.x2, y2: h.y2,
            stroke: "#8cb344",
            "stroke-width": "0.7",
            "stroke-linecap": "round",
            class: "fade-fill"
          });
          hairLine.style.setProperty("--fill-delay", `${tStart + 1.25}s`);
          flowerGroup.appendChild(hairLine);
        });

        // --- C. Alternating Leaves ---
        const leafConfigs = [
          { u: 0.32, side: -1, len: 90, wid: 46, delayOff: 0.4 },
          { u: 0.48, side:  1, len: 82, wid: 42, delayOff: 0.65 },
          { u: 0.64, side: -1, len: 74, wid: 38, delayOff: 0.9 },
          { u: 0.78, side:  1, len: 62, wid: 34, delayOff: 1.15 }
        ];

        for (let lIdx = 0; lIdx < cfg.leafCount; lIdx++) {
          const lCfg = leafConfigs[lIdx];
          const leafStemPt = evalCubicBezier(p0, p1, p2, p3, lCfg.u);
          const leafStemTan = evalCubicBezierTangent(p0, p1, p2, p3, lCfg.u);
          const leafGeom = buildLeafGeometry(leafStemPt, leafStemTan, lCfg.side, lCfg.len, lCfg.wid);

          const leafDelay = tStart + lCfg.delayOff;

          // Stalk
          const stalkLine = createSVGEl("path", {
            d: leafGeom.stalkD,
            fill: "none",
            stroke: "#2f4817",
            "stroke-width": "2.2",
            pathLength: "1",
            class: "draw-stroke"
          });
          stalkLine.style.setProperty("--delay", `${leafDelay}s`);
          stalkLine.style.setProperty("--dur", "0.6s");
          flowerGroup.appendChild(stalkLine);

          // Leaf 3D Fill
          const leafFill = createSVGEl("path", {
            d: leafGeom.outlineD,
            fill: "url(#grad-leaf-3d)",
            class: "fade-fill"
          });
          leafFill.style.setProperty("--fill-delay", `${leafDelay + 0.35}s`);
          leafFill.style.setProperty("--fade-dur", "0.65s");
          flowerGroup.appendChild(leafFill);

          // Outline
          const leafOutline = createSVGEl("path", {
            d: leafGeom.outlineD,
            fill: "none",
            stroke: "#18280d",
            "stroke-width": "1.3",
            pathLength: "1",
            class: "soften-outline"
          });
          leafOutline.style.setProperty("--delay", `${leafDelay + 0.15}s`);
          leafOutline.style.setProperty("--draw-dur", "0.85s");
          leafOutline.style.setProperty("--soft-opacity", "0.4");
          flowerGroup.appendChild(leafOutline);

          // Midrib
          const midribLine = createSVGEl("path", {
            d: leafGeom.midribD,
            fill: "none",
            stroke: "#88ab43",
            "stroke-width": "1.4",
            pathLength: "1",
            class: "draw-stroke"
          });
          midribLine.style.setProperty("--delay", `${leafDelay + 0.45}s`);
          midribLine.style.setProperty("--dur", "0.6s");
          flowerGroup.appendChild(midribLine);

          // Side Veins
          leafGeom.veins.forEach((vD, vIdx) => {
            const vLine = createSVGEl("path", {
              d: vD,
              fill: "none",
              stroke: "#6f9331",
              "stroke-width": "0.9",
              pathLength: "1",
              class: "draw-stroke"
            });
            vLine.style.setProperty("--delay", `${leafDelay + 0.6 + vIdx * 0.05}s`);
            vLine.style.setProperty("--dur", "0.5s");
            flowerGroup.appendChild(vLine);
          });
        }

        // --- D. Calyx Phyllary Bracts ---
        const bracts = buildBracts(headCx, headCy, cfg.headRadius * 0.98, 18);
        bracts.forEach((bD, bIdx) => {
          const bDelay = tStart + 1.4 + bIdx * 0.035;

          const bFill = createSVGEl("path", {
            d: bD,
            fill: "url(#grad-bract)",
            class: "fade-fill"
          });
          bFill.style.setProperty("--fill-delay", `${bDelay + 0.2}s`);
          bFill.style.setProperty("--fade-dur", "0.5s");
          flowerGroup.appendChild(bFill);

          const bStroke = createSVGEl("path", {
            d: bD,
            fill: "none",
            stroke: "#14240a",
            "stroke-width": "1.1",
            pathLength: "1",
            class: "soften-outline"
          });
          bStroke.style.setProperty("--delay", `${bDelay}s`);
          bStroke.style.setProperty("--draw-dur", "0.5s");
          bStroke.style.setProperty("--soft-opacity", "0.4");
          flowerGroup.appendChild(bStroke);
        });

        // --- E. 3D SCULPTURED PETALS (Dual-Facet Shading) ---
        const nPetals = cfg.petalCount;
        const step = (Math.PI * 2) / nPetals;

        // 1. Back Whorl (Deep receded bronze/amber, in shadow behind front whorl)
        for (let i = 0; i < nPetals; i++) {
          const ang = i * step + rand(-0.04, 0.04);
          const petal = build3DPetal(headCx, headCy, ang, cfg.headRadius, cfg.petalLen * 1.05, cfg.petalWidth * 0.95, headTilt, squashY, false);
          const delay = tStart + 1.8 + i * 0.045;

          const petalG = createSVGEl("g", { class: "petal-unfurl" });
          petalG.style.setProperty("--origin-x", `${petal.baseCenter.x}px`);
          petalG.style.setProperty("--origin-y", `${petal.baseCenter.y}px`);
          petalG.style.setProperty("--delay", `${delay}s`);
          petalG.style.setProperty("--dur", "0.9s");
          petalG.style.setProperty("--jitter-rot", `${rand(-8, 8)}deg`);

          // Back Petal Body
          const pFill = createSVGEl("path", {
            d: petal.outlineD,
            fill: "url(#grad-petal-back)",
            class: "fade-fill"
          });
          pFill.style.setProperty("--fill-delay", `${delay + 0.25}s`);
          pFill.style.setProperty("--fade-dur", "0.6s");
          petalG.appendChild(pFill);

          // Outline
          const pOutline = createSVGEl("path", {
            d: petal.outlineD,
            fill: "none",
            stroke: "#5d2702",
            "stroke-width": "1.1",
            pathLength: "1",
            class: "soften-outline"
          });
          pOutline.style.setProperty("--delay", `${delay}s`);
          pOutline.style.setProperty("--draw-dur", "0.65s");
          pOutline.style.setProperty("--soft-opacity", "0.35");
          petalG.appendChild(pOutline);

          flowerGroup.appendChild(petalG);
        }

        // 2. Front Whorl (Sculpted with dual-facet 3D lighting: Sunlit vs Shadowed side)
        for (let i = 0; i < nPetals; i++) {
          const ang = (i + 0.5) * step + rand(-0.04, 0.04);
          const petal = build3DPetal(headCx, headCy, ang, cfg.headRadius, cfg.petalLen, cfg.petalWidth, headTilt, squashY, true);
          const delay = tStart + 2.6 + i * 0.045;

          const petalG = createSVGEl("g", { class: "petal-unfurl" });
          petalG.style.setProperty("--origin-x", `${petal.baseCenter.x}px`);
          petalG.style.setProperty("--origin-y", `${petal.baseCenter.y}px`);
          petalG.style.setProperty("--delay", `${delay}s`);
          petalG.style.setProperty("--dur", "0.95s");
          petalG.style.setProperty("--jitter-rot", `${rand(-6, 6)}deg`);

          // 3D Dual-Facet Shading:
          // Left Facet
          const leftFacet = createSVGEl("path", {
            d: petal.leftFacetD,
            fill: petal.sunFacing ? "url(#grad-petal-sun)" : "url(#grad-petal-shadow)",
            class: "fade-fill"
          });
          leftFacet.style.setProperty("--fill-delay", `${delay + 0.22}s`);
          leftFacet.style.setProperty("--fade-dur", "0.65s");
          petalG.appendChild(leftFacet);

          // Right Facet
          const rightFacet = createSVGEl("path", {
            d: petal.rightFacetD,
            fill: petal.sunFacing ? "url(#grad-petal-shadow)" : "url(#grad-petal-sun)",
            class: "fade-fill"
          });
          rightFacet.style.setProperty("--fill-delay", `${delay + 0.22}s`);
          rightFacet.style.setProperty("--fade-dur", "0.65s");
          petalG.appendChild(rightFacet);

          // Central Rib Crease
          const pCrease = createSVGEl("path", {
            d: petal.creaseD,
            fill: "none",
            stroke: "#b85d07",
            "stroke-width": "1.2",
            pathLength: "1",
            class: "draw-stroke"
          });
          pCrease.style.setProperty("--delay", `${delay + 0.3}s`);
          pCrease.style.setProperty("--dur", "0.5s");
          petalG.appendChild(pCrease);

          // Outer Boundary Outline
          const pOutline = createSVGEl("path", {
            d: petal.outlineD,
            fill: "none",
            stroke: "#763b04",
            "stroke-width": "1.1",
            pathLength: "1",
            class: "soften-outline"
          });
          pOutline.style.setProperty("--delay", `${delay}s`);
          pOutline.style.setProperty("--draw-dur", "0.7s");
          pOutline.style.setProperty("--soft-opacity", "0.35");
          petalG.appendChild(pOutline);

          flowerGroup.appendChild(petalG);
        }

        // --- F. 3D CONVEX SEED DOME & PHYLLOTAXIS SEEDS ---
        const seedDelay = tStart + 3.8;
        const seedDome = build3DSeedDome(headCx, headCy, cfg.headRadius * 0.95, headTilt, squashY, 360);

        // 1. Protruding Dome Cast-Shadow onto Petals
        const domeShadow = createSVGEl("ellipse", {
          cx: headCx, cy: headCy + 6,
          rx: cfg.headRadius * 1.08, ry: cfg.headRadius * 1.08 * squashY,
          fill: "url(#grad-dome-cast-shadow)",
          transform: `rotate(${headTilt * 180 / Math.PI} ${headCx} ${headCy + 6})`,
          class: "fade-fill"
        });
        domeShadow.style.setProperty("--fill-delay", `${seedDelay}s`);
        domeShadow.style.setProperty("--fade-dur", "0.6s");
        flowerGroup.appendChild(domeShadow);

        // 2. 3D Convex Dome Base
        const discFill = createSVGEl("path", {
          d: seedDome.discD,
          fill: "url(#grad-seed-dome-3d)",
          class: "fade-fill"
        });
        discFill.style.setProperty("--fill-delay", `${seedDelay + 0.15}s`);
        discFill.style.setProperty("--fade-dur", "0.7s");
        flowerGroup.appendChild(discFill);

        // 3. Wobbly Disc Outline
        const discOutline = createSVGEl("path", {
          d: seedDome.discD,
          fill: "none",
          stroke: "#233311",
          "stroke-width": "1.3",
          pathLength: "1",
          class: "soften-outline"
        });
        discOutline.style.setProperty("--delay", `${seedDelay}s`);
        discOutline.style.setProperty("--draw-dur", "0.9s");
        discOutline.style.setProperty("--soft-opacity", "0.5");
        flowerGroup.appendChild(discOutline);

        // 4. Grouped 3D Seeds
        const seedGroup = createSVGEl("g", { class: "seed-spiral-bloom" });
        seedGroup.style.setProperty("--origin-x", `${headCx}px`);
        seedGroup.style.setProperty("--origin-y", `${headCy}px`);
        seedGroup.style.setProperty("--delay", `${seedDelay + 0.35}s`);
        seedGroup.style.setProperty("--dur", "1.3s");

        const pCore = createSVGEl("path", { d: seedDome.pathCore, fill: "#110703" });
        seedGroup.appendChild(pCore);

        const pMid = createSVGEl("path", { d: seedDome.pathMid, fill: "#542a10" });
        seedGroup.appendChild(pMid);

        const pRim = createSVGEl("path", { d: seedDome.pathRim, fill: "#b56318" });
        seedGroup.appendChild(pRim);

        const pHL = createSVGEl("path", { d: seedDome.pathHighlights, fill: "#ffda5a" });
        seedGroup.appendChild(pHL);

        flowerGroup.appendChild(seedGroup);

        // 5. Upright 3D Rim Tubular Florets
        const pFlorets = createSVGEl("path", {
          d: seedDome.floretsD,
          fill: "none",
          stroke: "#f3a516",
          "stroke-width": "1.4",
          "stroke-linecap": "round",
          class: "fade-fill"
        });
        pFlorets.style.setProperty("--fill-delay", `${seedDelay + 0.5}s`);
        pFlorets.style.setProperty("--fade-dur", "0.7s");
        flowerGroup.appendChild(pFlorets);

        layerFlowers.appendChild(flowerGroup);
      });

      // 3. Drifting Pollen Specks (with simulated Depth of Field)
      for (let s = 0; s < 16; s++) {
        const sx = rand(baseW * 0.12, baseW * 0.88);
        const sy = rand(baseH * 0.30, baseH * 0.88);
        const sr = rand(1.2, 3.2);
        const dur = rand(9, 16);
        const delay = rand(2, 11);
        const maxA = rand(0.4, 0.8);

        const speck = createSVGEl("circle", {
          cx: sx, cy: sy, r: sr,
          fill: sr > 2.4 ? "#ffe066" : "#f5bf38",
          class: "drifting-speck"
        });
        speck.style.setProperty("--dur", `${dur}s`);
        speck.style.setProperty("--delay", `${delay}s`);
        speck.style.setProperty("--max-alpha", maxA);
        speck.style.setProperty("--drift-x", `${rand(-50, 50)}px`);
        layerPollen.appendChild(speck);
      }

      // 4. Vignette & Grain
      const grainRect = createSVGEl("rect", {
        x: 0, y: 0, width: baseW, height: baseH,
        filter: "url(#paper-grain)",
        opacity: "0.18"
      });
      layerVignette.appendChild(grainRect);
    }

    // --- 7. INTERACTIVE 3D PERSPECTIVE ORBIT ENGINE ---
    let is3DEnabled = true;
    let targetRotX = 0;
    let targetRotY = 0;
    let currentRotX = 0;
    let currentRotY = 0;
    let animFrameId = null;

    function setup3DInteraction() {
      const container = document.getElementById("canvas-container");
      const stage = document.getElementById("stage-3d");
      const btn3D = document.getElementById("btn-3d");
      const label3D = document.getElementById("label-3d");

      // Smooth Animation Loop
      function update3DTilt() {
        if (is3DEnabled) {
          // Autonomous subtle breathing orbit when mouse is idle
          const idleTime = performance.now() * 0.0008;
          const idleX = Math.sin(idleTime) * 3.5;
          const idleY = Math.cos(idleTime * 0.7) * 4.5;

          const destX = targetRotX + idleX;
          const destY = targetRotY + idleY;

          // Smooth interpolation (lerp)
          currentRotX += (destX - currentRotX) * 0.08;
          currentRotY += (destY - currentRotY) * 0.08;

          stage.style.transform = `rotateX(${currentRotX.toFixed(2)}deg) rotateY(${currentRotY.toFixed(2)}deg) scale(1.02)`;
        } else {
          stage.style.transform = "none";
        }
        if (typeof requestAnimationFrame !== "undefined") {
          animFrameId = requestAnimationFrame(update3DTilt);
        }
      }
      if (typeof requestAnimationFrame !== "undefined") {
        animFrameId = requestAnimationFrame(update3DTilt);
      }

      // Desktop Mouse Move
      window.addEventListener("mousemove", (e) => {
        if (!is3DEnabled) return;
        const normX = (e.clientX / window.innerWidth) - 0.5; // -0.5 to 0.5
        const normY = (e.clientY / window.innerHeight) - 0.5;

        // Max 3D tilt: ±14 degrees pitch & yaw
        targetRotY = normX * 22;
        targetRotX = -normY * 18;
      });

      // Mobile / Touch Drag
      let touchStartX = 0;
      let touchStartY = 0;
      window.addEventListener("touchstart", (e) => {
        if (e.touches.length > 0) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      window.addEventListener("touchmove", (e) => {
        if (!is3DEnabled || e.touches.length === 0) return;
        const deltaX = (e.touches[0].clientX - touchStartX) / window.innerWidth;
        const deltaY = (e.touches[0].clientY - touchStartY) / window.innerHeight;

        targetRotY = deltaX * 30;
        targetRotX = -deltaY * 24;
      }, { passive: true });

      window.addEventListener("touchend", () => {
        targetRotX = 0;
        targetRotY = 0;
      });

      // 3D Depth Toggle Button
      btn3D.addEventListener("click", () => {
        is3DEnabled = !is3DEnabled;
        if (is3DEnabled) {
          btn3D.classList.add("active-badge");
          label3D.textContent = "3D Depth: On";
        } else {
          btn3D.classList.remove("active-badge");
          label3D.textContent = "3D Depth: Off";
          stage.style.transform = "none";
        }
      });
    }

    // --- 8. INITIALIZATION ---
    function init() {
      renderArtwork(currentSeed, { instant: false });
      setup3DInteraction();

      // Replay Button
      const btnReplay = document.getElementById("btn-replay");
      btnReplay.addEventListener("click", () => {
        currentSeed = randInt(100, 99999);
        renderArtwork(currentSeed, { instant: false });
      });

      // 'R' Keyboard Shortcut
      window.addEventListener("keydown", (e) => {
        if (e.key === "r" || e.key === "R") {
          currentSeed = randInt(100, 99999);
          renderArtwork(currentSeed, { instant: false });
        }
      });

      // Responsive Resize: Instant repaint with same seed (no animation replay)
      let resizeTimer = null;
      let lastWidth = window.innerWidth;
      let lastHeight = window.innerHeight;

      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const nw = window.innerWidth;
          const nh = window.innerHeight;
          if (Math.abs(nw - lastWidth) > 40 || Math.abs(nh - lastHeight) > 40) {
            lastWidth = nw;
            lastHeight = nh;
            renderArtwork(currentSeed, { instant: true });
          }
        }, 150);
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
